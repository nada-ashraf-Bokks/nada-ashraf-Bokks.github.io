<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سرك فى بير من ورق | ندى أشرف</title>
<meta name="description" content="التسجيلات الصوتية لكتاب سرك فى بير من ورق بصوت ندى أشرف">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1dcd4;--card:#fbf3ee;--ink:#3a1f17;--soft:#7a5a50;--accent:#9b4f4b;--on-accent:#fff;--line:#e0c2b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a17;--card:#38251f;--ink:#f3e1da;--soft:#c9a99e;--accent:#e3a8a1;--on-accent:#2a1a17;--line:#503832}}
:root[data-theme="dark"]{--bg:#2a1a17;--card:#38251f;--ink:#f3e1da;--soft:#c9a99e;--accent:#e3a8a1;--on-accent:#2a1a17;--line:#503832}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic",Tahoma,serif;font-size:18px;line-height:1.9}
main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
h1,h2{font-family:"Reem Kufi","Noto Naskh Arabic",Tahoma,sans-serif;margin:0}
.hero{padding:28px 0 22px}
.cover{display:block;width:min(300px,78%);margin:0 auto 22px;border-radius:6px;box-shadow:0 10px 28px rgba(58,31,23,.28)}
.hero{text-align:center}.wave{justify-content:center}
.hero h1{font-size:clamp(34px,9vw,52px);line-height:1.25;font-weight:700}
.hero p{margin:10px 0 0;color:var(--soft)}
.wave{display:flex;align-items:center;gap:5px;height:44px;margin-top:20px}
.wave i{display:block;width:5px;border-radius:3px;background:var(--accent);height:var(--h)}
.wave.live i{animation:bar 1s ease-in-out infinite alternate;animation-delay:calc(var(--n)*70ms)}
@keyframes bar{to{height:8px}}
@media (prefers-reduced-motion:reduce){.wave.live i{animation:none}}
.ep{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.ep h2{font-size:22px}
.ep p{margin:4px 0 12px;color:var(--soft);font-size:16px;line-height:1.7}
.row{display:flex;align-items:center;gap:12px}
.play{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;display:grid;place-items:center}
.play svg{width:22px;height:22px;fill:currentColor}
.play:focus-visible,.speed:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.bar{flex:1;direction:ltr}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.time{font-size:14px;color:var(--soft);direction:ltr;display:flex;justify-content:space-between}
.speed{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:2px 10px;font:inherit;font-size:14px;cursor:pointer}
.soon{color:var(--soft);font-size:15px;margin:0}
footer{margin-top:34px;text-align:center;color:var(--soft);font-size:15px}

#admin{margin-top:30px;padding:18px;border:2px dashed var(--accent);border-radius:14px;background:var(--card)}
#admin h2{font-size:22px;margin-bottom:4px}
#admin .hint{color:var(--soft);font-size:15px;margin:0 0 12px;line-height:1.7}
.ae{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px}
.ae input[type=text]{width:100%;font:inherit;font-size:16px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.ae .st{font-size:14px;color:var(--soft);margin:0}
.ae button{justify-self:start;font:inherit;font-size:15px;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:4px 16px;cursor:pointer}
.ae button:disabled{opacity:.5}
.lnk{margin-top:10px;font:inherit;font-size:13px;background:none;border:0;color:var(--soft);text-decoration:underline;cursor:pointer;opacity:.7}
</style>
</head>

<script type="application/json" id="state">[{"title": "الفصل الأول", "desc": "التسجيل الصوتي للفصل الأول.", "src": "1.mp3"}, {"title": "الفصل الثاني", "desc": "التسجيل الصوتي للفصل الثاني.", "src": "2.mp3"}, {"title": "الفصل الثالث", "desc": "التسجيل الصوتي للفصل الثالث.", "src": "3.mp3"}, {"title": "الفصل الرابع", "desc": "التسجيل الصوتي للفصل الرابع.", "src": "4.mp3"}, {"title": "الفصل الخامس", "desc": "التسجيل الصوتي للفصل الخامس.", "src": "5.mp3"}, {"title": "الفصل السادس", "desc": "التسجيل الصوتي للفصل السادس.", "src": "6.mp3"}, {"title": "الفصل السابع", "desc": "التسجيل الصوتي للفصل السابع.", "src": "7.mp3"}]</script>
<script>
var EPISODES=JSON.parse(document.getElementById("state").textContent);
var wave=document.getElementById("wave"),list=document.getElementById("list"),current=null;
for(var i=0;i<34;i++){var b=document.createElement("i");b.style.setProperty("--n",i);b.style.setProperty("--h",(10+Math.abs(Math.sin(i*1.3)*30+Math.cos(i*.5)*8))+"px");wave.appendChild(b)}
var PLAY='<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
function fmt(s){if(!isFinite(s))return"0:00";var m=Math.floor(s/60),r=Math.floor(s%60);return m+":"+(r<10?"0":"")+r}
function render(){EPISODES.forEach(function(e){
  var el=document.createElement("article");el.className="ep";
  var h="<h2></h2><p></p>";el.innerHTML=h;
  el.querySelector("h2").textContent=e.title;el.querySelector("p").textContent=e.desc;
  if(!e.src){var s=document.createElement("p");s.className="soon";s.textContent="التسجيل ده هيتضاف قريب.";el.appendChild(s);list.appendChild(el);return}
  var a=new Audio();a.preload="none";a.src=e.src;
  var row=document.createElement("div");row.className="row";
  var btn=document.createElement("button");btn.className="play";btn.innerHTML=PLAY;btn.setAttribute("aria-label","تشغيل");
  var bar=document.createElement("div");bar.className="bar";
  var rng=document.createElement("input");rng.type="range";rng.min=0;rng.max=1000;rng.value=0;rng.setAttribute("aria-label","موضع التشغيل");
  var tm=document.createElement("div");tm.className="time";tm.innerHTML="<span>0:00</span><span>0:00</span>";
  bar.appendChild(rng);bar.appendChild(tm);
  var sp=document.createElement("button");sp.className="speed";sp.textContent="1×";sp.setAttribute("aria-label","سرعة التشغيل");
  row.appendChild(btn);row.appendChild(bar);row.appendChild(sp);el.appendChild(row);list.appendChild(el);
  btn.onclick=function(){
    if(a.paused){if(current&&current!==a)current.pause();current=a;a.play()}else a.pause()};
  a.onplay=function(){btn.innerHTML=PAUSE;btn.setAttribute("aria-label","إيقاف مؤقت");wave.classList.add("live")};
  a.onpause=function(){btn.innerHTML=PLAY;btn.setAttribute("aria-label","تشغيل");wave.classList.remove("live")};
  a.ontimeupdate=function(){if(a.duration)rng.value=a.currentTime/a.duration*1000;tm.children[0].textContent=fmt(a.currentTime);tm.children[1].textContent=fmt(a.duration)};
  a.onloadedmetadata=a.ontimeupdate;
  rng.oninput=function(){if(a.duration)a.currentTime=rng.value/1000*a.duration};
  var sps=[1,1.25,1.5,2,.75],si=0;
  sp.onclick=function(){si=(si+1)%sps.length;a.playbackRate=sps[si];sp.textContent=sps[si]+"×"};
});
}
Promise.all(EPISODES.map(function(e){if(!e.src)return;return fetch(e.src,{method:"HEAD"}).then(function(r){if(!r.ok)e.src=""}).catch(function(){})})).then(render);
</script>
</body>
</html>
